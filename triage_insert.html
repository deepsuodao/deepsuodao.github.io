  <!-- ===== 值班室·快答（精简版·独立页） ===== -->
  <section class="section" id="triage" style="background:rgba(0,0,0,.01);">
    <div class="container">

      <div class="section-title" style="margin-bottom:8px;">🛎️ 值班室·快答</div>
      <h2 style="margin-bottom:12px;">有什么财务疑问？搜一下，5分钟答完</h2>
      <p style="font-size:.9rem;color:#8a8885;margin-bottom:24px;">104个常见问题覆盖投资、保险、债务、税务、传承等。</p>

      <div style="max-width:600px;margin:0 auto 24px;display:flex;border:1px solid rgba(212,168,83,.2);border-radius:4px;overflow:hidden;">
        <input type="text" id="triage-search-index" placeholder="搜一下，5分钟答完…" style="flex:1;background:transparent;border:none;padding:14px 16px;font-size:.95rem;color:#e8e6e3;outline:none;font-family:inherit;" onkeydown="if(event.key===String.fromCharCode(13)){window.location.href='triage.html?q='+encodeURIComponent(this.value)}">
      </div>

      <div id="hot-faqs" style="max-width:700px;margin:0 auto;"></div>

      <div style="text-align:center;margin-top:24px;">
        <a href="triage.html" style="display:inline-block;padding:12px 28px;border:1px solid rgba(212,168,83,.25);color:#d4a853;font-size:.85rem;text-decoration:none;border-radius:3px;">📋 查看全部104条问答 →</a>
      </div>

    </div>
  </section>

  <script src="faq-data.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function(){
      var list = document.getElementById('hot-faqs');
      if(!list || typeof triageFAQs === 'undefined') return;
      var hot = triageFAQs.slice(0, 8);
      hot.forEach(function(item){
        var d = document.createElement('div');
        d.style.cssText = 'border-bottom:1px solid rgba(255,255,255,.04);padding:12px 0;';
        var qDiv = document.createElement('div');
        qDiv.style.cssText = 'display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-size:.9rem;color:#e8e6e3;';
        qDiv.innerHTML = '<span>' + item.q + '</span><span style="color:#6a6865;font-size:.7rem;">&#9654; 展开</span>';
        var aDiv = document.createElement('div');
        aDiv.style.cssText = 'display:none;margin-top:6px;font-size:.82rem;color:#b0aeab;line-height:1.6;';
        aDiv.innerHTML = item.a + (item.link ? ' <a href="'+item.link+'" style="color:#d4a853;font-size:.78rem;">相关对话→</a>' : '');
        qDiv.onclick = function(){aDiv.style.display='block';qDiv.querySelector('span:last-child').textContent='';};
        d.appendChild(qDiv);
        d.appendChild(aDiv);
        list.appendChild(d);
      });
    });
  </script>
