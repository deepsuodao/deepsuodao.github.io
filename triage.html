const triageFAQs = [
  {id:0, cat:'all', q:'规划为什么从一张人生清单开始？', a:'因为大多数人不知道自己想要什么，更不知道需要多少钱。人生清单把模糊的愿望变成具体的金额和时间线。先列清单再算缺口，让数字告诉你该存多少、投什么。', time:'短', link:'dialogue-01.html'},
  {id:1, cat:'all', q:'人生清单和财务规划是什么关系？', a:'人生清单是目标层——你想要什么；财务规划是执行层——怎么实现。清单在前，规划在后。没有清单的规划，就像没有目的地的导航。', time:'短', link:'dialogue-01.html'},
  {id:2, cat:'invest', q:'投资和投机怎么区分？', a:'投资看的是资产本身创造价值的能力（分红、租金、利润增长），时间越长越有利。投机看的是价格波动，靠别人出更高价接盘。区分标准：你买的这个东西不卖也能赚钱吗？', time:'短', link:'dialogue-01.html'},
  {id:3, cat:'invest', q:'财富的本质是什么？', a:'财富是时间的函数——把今天的劳动成果储存到未来。存钱是储存，投资是增值。财富管理的本质不是赚更多，是让已有资产在时间中复利增长。', time:'短', link:'dialogue-02.html'},
  {id:4, cat:'invest', q:'为什么说投资中最难的是\'安坐不动\'？', a:'因为市场波动会触发你的情绪——涨了想卖、跌了想跑。但真正赚钱的人，不是操作最多的，是坐得最稳的。频繁交易的成本（手续费+税+情绪损耗）会吃掉大部分收益。', time:'短', link:'dialogue-02.html'},
  {id:5, cat:'invest', q:'复利和负利分别是什么？', a:'复利=本金+收益再投资，利滚利。负利=通胀+费用在暗中侵蚀你的购买力。通胀每年吃掉2-3%，高费率产品吃掉1-2%，五年下来就是15-25%的购买力损失。', time:'短', link:'dialogue-03.html'},
  {id:6, cat:'invest', q:'普通人怎么利用复利？', a:'定投是最好的方式——每月固定金额买入，时间拉长、成本摊平。关键是早开始：30岁开始每月投1000元，到60岁比40岁开始多一倍以上。用复利计算器模拟。', time:'短', link:'dialogue-03.html'},
  {id:7, cat:'education', q:'儿童理财教育从几岁开始？', a:'6-8岁就可以开始。三个账户：消费账户（花）、储蓄账户（存）、梦想账户（投）。压岁钱是最好的教学素材，让孩子自己决定怎么分配三份。', time:'短', link:'dialogue-04.html'},
  {id:8, cat:'invest', q:'三个账户的具体比例是多少？', a:'建议：消费账户30%、储蓄账户50%、梦想账户20%。随着年龄增长调整——12岁以后梦想账户比例可以提高到30-40%，培养投资意识。', time:'短', link:'dialogue-04.html'},
  {id:9, cat:'education', q:'财商教育分哪几个阶段？', a:'三阶段：小学（6-12岁）建立储蓄习惯和延迟满足；初中（12-15岁）理解复利和风险概念；高中（15-18岁）学习资产配置和投资基础。每个阶段有对应的工具和方法。', time:'中', link:'dialogue-04B.html'},
  {id:10, cat:'education', q:'教孩子理财会不会让他变得太功利？', a:'不会。财商教育的核心不是钱，是选择、纪律和长期思维。让孩子理解\'今天不花明天能花更多\'，比直接给零花钱更有价值。', time:'短', link:'dialogue-04B.html'},
  {id:11, cat:'invest', q:'提前还房贷划算吗？', a:'没有统一答案，核心看三个条件：①息差（投资收益率－房贷利率）是否为正；②资产分红能否覆盖年还款额；③剩余还款年限是否足够长（≥10年）。三个同时满足，持有资产更划算；任意一条不满足，提前还贷更稳妥。建议用本站提前还贷对比器输入您的实际数据算清楚。', time:'中', link:'dialogue-05.html'},
  {id:12, cat:'invest', q:'「息差」是什么？怎么算？', a:'息差 = 您持有资产的年化收益率 － 房贷利率。例如房贷利率3%，您的投资组合历史年化收益8%，息差就是5%——相当于银行以3%成本借钱给您，您拿这笔钱赚了8%。息差为正时，保留负债是有利的；息差为0或负时，提前还贷更划算。', time:'中', link:'dialogue-05.html'},
  {id:13, cat:'liability', q:'股票分红不够覆盖房贷月供，还能持有资产吗？', a:'可以，但需要您用工资收入补贴还款缺口，且息差要足够大，才能覆盖这部分成本。如果补贴后心理压力过大，或息差很小（＜2%），建议优先提前还贷，保障现金流安全。', time:'短', link:'dialogue-05.html'},
  {id:14, cat:'liability', q:'只剩10年还清房贷，还有必要算这个吗？', a:'剩余年限越短，复利基数放大效应越弱，持有资产的优势会缩小。10年以内建议优先考虑现金流安全性和心理舒适度，不必强行持有资产。', time:'短', link:'dialogue-05.html'},
  {id:15, cat:'all', q:'家庭管钱的人需要具备什么能力？', a:'五条标准：①风险意识——知道什么不能碰；②纪律性——能执行计划不被情绪左右；③沟通意愿——愿意和家人商量；④专业判断——能分辨产品好坏；⑤情绪稳定性——市场波动时不慌。', time:'中', link:'dialogue-06.html'},
  {id:16, cat:'invest', q:'管钱是一个人说了算还是全家参与？', a:'建议建立家庭财务决策机制——日常小额支出各自决定，大额投资（＞月收入30%）需要全家讨论。管钱不是谁说了算，是建立规则让规则说了算。', time:'短', link:'dialogue-06.html'},
  {id:17, cat:'insurance', q:'五格结构图是哪五格？各有什么作用？', a:'五格：①安全感格子（保障金+应急金，占10-20%）；②防御格子（固收+保险，占20-30%）；③进攻格子（权益+房产，占30-50%）；④收益格子（卫星仓位如行业ETF，占5-15%）；⑤现金格子（日常流动性，占5-10%）。比例随年龄动态调整。', time:'中', link:'dialogue-07.html'},
  {id:18, cat:'all', q:'五格结构图和标准普尔四象限有什么不同？', a:'标准普尔四象限是固定比例（10%零钱+20%保命+30%生钱+40%保本），过于机械。五格结构图更灵活：按年龄、收入、风险偏好动态调整比例；增加\'安全感格子\'作为心理底线；用\'收益格子\'做卫星仓位配置。', time:'中', link:'dialogue-07.html'},
  {id:19, cat:'all', q:'不同年龄段五格比例怎么调？', a:'30岁以下：进攻格子可占50-60%，安全感格子10%；30-45岁：进攻+防御各40%，安全感15%；45-55岁：防御提升至50%，进攻降至25%；55岁以上：防御60%+安全感20%，进攻不超过10%。建议用本站五格家庭财务结构图填自己的数据。', time:'中', link:'dialogue-07.html'},
  {id:20, cat:'all', q:'五格结构图和资产配置是什么关系？', a:'五格结构图是资产配置的可视化工具。把抽象的比例分配到五个具体\'格子\'里，让你一眼看清钱在哪、风险在哪。它不替代资产配置，而是让配置看得见、执行得了。', time:'短', link:'dialogue-07.html'},
  {id:21, cat:'invest', q:'守夜人五条底线是哪五条？', a:'①保障金底线（6-36个月支出）；②负债边界（总负债率＜50%）；③流动性防线（3万24小时可取）；④家庭关系底线（重大决策需沟通）；⑤投资纪律红线（不跟风、不杠杆、不押注）。', time:'中', link:'dialogue-08.html'},
  {id:22, cat:'all', q:'普通人怎么执行守夜人机制？', a:'不需要每天盯着，而是设置规则让系统替你值班。每个月用一次八问自检表，每季度做一次财务体检，每年做一次全面审计。超过底线自动触发调整动作。', time:'短', link:'dialogue-08.html'},
  {id:23, cat:'all', q:'交易频率高为什么不好？', a:'高频交易有三个代价：①手续费摩擦成本，一年交易20次手续费就吃掉3-5%收益；②情绪损耗，频繁看盘让人焦虑；③决策质量下降，操作越多错误越多。减少80%的交易，收益反而可能更好。', time:'中', link:'dialogue-09.html'},
  {id:24, cat:'invest', q:'怎么建立投资纪律？', a:'三步：①设定交易规则（什么情况下买、什么情况下卖）；②用工具代替意志力（定投自动扣款）；③减少查看频率（一个月看一次足够了）。相信系统而不是感觉。', time:'短', link:'dialogue-09.html'},
  {id:25, cat:'invest', q:'八问自检表检查哪八个方面？', a:'收入来源、支出结构、负债水平、保障覆盖、投资配置、流动性、传承安排、保险充足度。每个维度对应具体指标，填完自动出分。15分钟测完14个财务指标。', time:'短', link:'dialogue-10.html'},
  {id:26, cat:'education', q:'审计频率建议多久一次？', a:'基础版：每月一查（收支流水）；完整版：每季一检（八问自检表）；深度版：每年一审（全面财务体检）。如果家庭有重大变化（换工作、生孩子、买房），额外做一次。', time:'短', link:'dialogue-10.html'},
  {id:27, cat:'insurance', q:'保障金和急用金有什么区别？', a:'急用金（应急金）= 6-12个月生活支出，应对短期突发如失业、医疗。保障金 = 36个月支出，应对长期冲击如重病、经济危机。保障金是\'无论如何我都撑得住\'的心理底线，让你在市场波动时拿住资产不被迫卖出。', time:'中', link:'dialogue-11.html'},
  {id:28, cat:'all', q:'保障金要存多少钱？怎么算？', a:'保障金 = 月均生活支出 × 目标月数 × 压力系数。标准：应急金6-12个月 + 保障金36个月。例如家庭月支出1万元，保障金目标就是36万。建议用本站保障金测算器输入您的实际数据算清楚。', time:'中', link:'dialogue-11.html'},
  {id:29, cat:'all', q:'保障金存哪里？放银行还是买理财？', a:'保障金的核心要求是安全性和流动性，不是收益率。建议放在：①货币基金（余额宝类，随时可取）；②大额存单（可提前支取）；③短期国债。不要投入任何有本金波动风险的产品。', time:'中', link:'dialogue-11.html'},
  {id:30, cat:'liability', q:'已经有房贷了，还需要存保障金吗？', a:'更需要。有房贷意味着每月有固定支出，一旦收入中断风险更大。建议先存满6个月应急金再提前还贷，保障金和房贷不矛盾，是两道不同的防线。', time:'短', link:'dialogue-11.html'},
  {id:31, cat:'all', q:'规划师和守夜人分别做什么？', a:'规划师画蓝图——帮你做五格结构图、设定资产配置比例、规划长期目标。守夜人盯底线——监控五条安全线是否越界、提醒你该调整了。一个负责\'往哪走\'，一个负责\'别掉坑\'。', time:'中', link:'dialogue-12.html'},
  {id:32, cat:'all', q:'一个人能同时扮演两个角色吗？', a:'理论上可以，但实践上很难。规划师需要专业知识和策略思维，守夜人需要纪律性和情绪隔离。多数人做不到自己给自己踩刹车，所以才需要双角色分工。', time:'短', link:'dialogue-12.html'},
  {id:33, cat:'liability', q:'连带担保的法律风险有多大？', a:'超大。连带担保意味着债主可以直接找你全额追偿，不需要先找主债务人。一个签字可能意味着你替别人还几十万甚至几百万。法律上你不是\'保人\'，你是\'共同债务人\'。', time:'短', link:'dialogue-13.html'},
  {id:34, cat:'liability', q:'朋友让我帮忙担保，怎么拒绝？', a:'三句话：①\'我理解你需要帮助，但连带担保对我来说风险太大了\'；②\'我可以帮你想想其他办法——比如有没有资产做抵押担保？\'；③\'或者我帮你出点钱咨询专业律师找替代方案\'。既保住了关系，又保护了自己。', time:'中', link:'dialogue-13.html'},
  {id:35, cat:'all', q:'流动性资产分哪三级？', a:'一级（即时可取）：现金、货币基金、活期存款，3万以内24小时可达；二级（3-7天可变现）：股票、ETF、短债基金；三级（1-3个月变现）：定期存款、大额存单。建议一级至少覆盖3个月支出。', time:'中', link:'dialogue-14.html'},
  {id:36, cat:'insurance', q:'应急金和保障金的区别？', a:'应急金=6-12个月支出，应对短期突发（失业、医疗），要求即时可取。保障金=36个月支出，应对长期冲击（重病、经济危机），可以配置在流动性稍差但收益略高的产品。两者叠加才是完整的安全垫。', time:'中', link:'dialogue-14.html'},
  {id:37, cat:'all', q:'AI能在家庭财富管理中做什么？', a:'AI适合做三件事：①数据分析——自动抓取资产信息生成五格图；②情绪监控——在市场波动时提醒你冷静；③风险预警——当某项指标越线时自动通知。AI是守夜人的好助手。', time:'中', link:'dialogue-15.html'},
  {id:38, cat:'all', q:'AI会取代财富规划师吗？', a:'不会。AI做数据分析、规则执行、情绪监控；人做价值判断、长期战略、家庭关系。最好的模式是人机协作——AI帮你算清楚，你来做决策。', time:'短', link:'dialogue-15.html'},
  {id:39, cat:'invest', q:'中产财务困境的三大根源是什么？', a:'①收入陷阱——收入越高支出也越高，存不下钱；②消费陷阱——生活方式通胀，赚得越多花得越多；③投资陷阱——焦虑情绪下追涨杀跌。破局：先做财务体检找缺口，再建保障金防风险。', time:'中', link:'dialogue-16.html'},
  {id:40, cat:'invest', q:'怎么判断自己是否陷入中产陷阱？', a:'三个信号：①月收入不低但月底剩不下钱；②没有6个月以上的应急金；③投资决策总是因为焦虑而不是因为计划。只要有任意一条，建议立刻做一次八问自检。', time:'短', link:'dialogue-16.html'},
  {id:41, cat:'invest', q:'现在该不该买房？', a:'先分清刚需还是投资。刚需看：房贷利率是否低位、月供是否占收入≤35%、能否持有5年以上。投资看：租金回报率能否覆盖持有成本、地段流动性是否足够。两套逻辑完全不同，混在一起决策容易出错。', time:'中', link:'dialogue-17.html'},
  {id:42, cat:'all', q:'月供占收入多少比例算是安全的？', a:'安全线：月供 ≤ 家庭月收入35%；预警线：超过40%；危险线：超过50%。购房后必须同步预留保障金（6-12个月支出），不要把所有现金砸进房产。', time:'短', link:'dialogue-17.html'},
  {id:43, cat:'invest', q:'投资买房怎么算才不亏？租金回报率要多少？', a:'租金回报率 = 年租金收入 ÷ 房产总价。至少要覆盖房贷利率 + 持有成本（物业/税费），才算正向现金流。如果租金覆盖不了月供，就是\'负持有\'，需要房价持续上涨才能盈利，风险较高。', time:'中', link:'dialogue-17.html'},
  {id:44, cat:'invest', q:'一线、新一线、三四线城市的买房逻辑一样吗？', a:'完全不一样。一线城市买的是稀缺性和抗通胀属性；新一线/强二线可兼顾自住和增值，选有产业/学区规划的板块；三四线城市除非本地刚需，否则不建议投资，流动性差是最大风险。', time:'中', link:'dialogue-17.html'},
  {id:45, cat:'education', q:'留学投资回报率怎么算？', a:'留学总成本（学费+生活费）vs 预期薪资溢价。关键变量：①留学国家（美国vs欧洲vs亚洲差距大）；②专业选择（STEM专业回报最高）；③是否留当地工作。建议用复利计算器模拟投入产出比。', time:'中', link:'dialogue-18.html'},
  {id:46, cat:'education', q:'留学和在国内读书怎么选？', a:'不是非此即彼。建议路线：本科在国内打基础，研究生再出国深造。这样既降低了总成本，又获得了海外经历的加分。留学不是目的，是手段——想清楚留学为了什么再决定。', time:'短', link:'dialogue-18.html'},
  {id:47, cat:'all', q:'实际利率怎么算？为什么存款在缩水？', a:'实际利率=名义利率-通胀率。目前一年期定存1.5%，通胀约2-3%，实际利率为-0.5%到-1.5%。意味着10万存一年，实际购买力减少了500-1500元。这就是存款悄悄融化的原因。', time:'中', link:'dialogue-19.html'},
  {id:48, cat:'all', q:'抗通胀应该配置什么资产？', a:'三层次：①保持6个月流动性（货币基金）；②配置抗通胀资产（权益类ETF、REITs、可转债）；③减少现金持仓。不需要全部投到高风险资产，但要确保大部分资产收益率跑赢通胀。', time:'中', link:'dialogue-19.html'},
  {id:49, cat:'education', q:'高考志愿填报的优先级是什么？', a:'专业权重40% > 城市30% > 学校20% > 其他10%。专业决定职业方向，城市决定实习和就业机会，学校决定起点。但前提是：①先做兴趣测评；②查清专业就业率；③评估家庭经济承受力。', time:'中', link:'dialogue-20.html'},
  {id:50, cat:'education', q:'高考后的暑假应该做什么？', a:'不做三件事：①不干等分数——做四要素功课（专业×城市×学校×就业）；②不盲目跟风选热门专业——热门不等于适合；③不把所有希望押在一次选择上——本科后还可以考研转方向。建议用人生愿望清单梳理目标。', time:'中', link:'dialogue-20.html'},
  {id:51, cat:'all', q:'家庭财富传承最重要的是传什么？', a:'不是传多少钱，是传价值观和治理机制。范氏义庄900年的启示：一套好规则比一笔大钱更持久。三件事：①写家族宪法（价值观+决策原则）；②设家族信托（资产隔离+税务优化）；③定期开家族会议。', time:'中', link:'dialogue-21.html'},
  {id:52, cat:'invest', q:'普通家庭需要做家族信托吗？', a:'资产500万以上的家庭建议考虑。资产较少的家庭可以先从家族宪法和定期家庭会议开始——把\'怎么用钱\'\'怎么投资\'\'怎么分钱\'的规则写下来，比信托本身更重要。', time:'短', link:'dialogue-21.html'},
  {id:53, cat:'education', q:'家庭保险配置的第一步是什么？先保谁？', a:'先保家庭收入支柱——家里赚钱最多的那个人。顺序：家庭支柱（医疗+重疾+寿险）→ 配偶（医疗+重疾）→ 孩子（医疗+意外）。不要给孩子买高额寿险，那是顺序错了。', time:'短', link:'dialogue-22.html'},
  {id:54, cat:'education', q:'保费预算应该占收入的多少？', a:'建议保费总支出不超过家庭年收入的10%。其中：家庭支柱的保费占大头（60-70%），配偶20-25%，孩子5-10%。如果保费压力大，优先保证医疗和重疾，寿险可以用定期寿险降低保费。', time:'中', link:'dialogue-22.html'},
  {id:55, cat:'invest', q:'四大险种（医疗/重疾/寿险/意外）怎么选？', a:'①医疗险（百万医疗）：基础配置，报销住院费用；②重疾险：确诊即赔，用于收入补偿；③定期寿险：家庭支柱必备，防身故后家庭断流；④意外险：低保费高杠杆，覆盖突发意外。建议先配医疗+定寿，再加重疾，意外看预算。', time:'中', link:'dialogue-22.html'},
  {id:56, cat:'retirement', q:'已经有社保了，还需要商业保险吗？', a:'需要。社保有三大缺口：①报销上限（通常20-30万，大病不够）；②自费药不报（进口药/靶向药）；③收入中断不补偿。商业保险专门补这三个缺口。先算保障缺口再买。', time:'中', link:'dialogue-22.html'},
  {id:57, cat:'education', q:'什么是好债？什么是坏债？', a:'好债=能产生现金流或增值的债务，如房贷（3%利率买资产）、教育贷（投资人力资本）。坏债=纯消费性债务，如信用卡循环利息（年化15%+）、消费贷买手机/旅游。核心标准：这笔钱借来是买资产还是买消费。', time:'中', link:'dialogue-23.html'},
  {id:58, cat:'liability', q:'负债率的红线是多少？怎么算？', a:'三条红线：①总负债率（总负债÷总资产）不超过50%；②月供收入比（月还款÷月收入）不超过40%；③高息债务清零（年化大于6%的债务优先还）。建议用本站负债压力测试输入数据算清楚。', time:'中', link:'dialogue-23.html'},
  {id:59, cat:'liability', q:'有房贷的同时要不要提前还清消费贷？', a:'要，而且优先还消费贷。房贷利率3-4%，消费贷利率通常在12-18%。同样的资金，还消费贷的\'收益率\'远高于还房贷。还款顺序：高息消费贷>信用卡>车贷>房贷。', time:'短', link:'dialogue-23.html'},
  {id:60, cat:'liability', q:'负债率和收入有关吗？收入高是不是可以多负债？', a:'有关但不绝对。收入高可以承受更高月供，但总负债率红线不变。即使月入10万，总负债超过总资产的50%仍然是高风险信号，因为资产价格可能下跌、收入可能中断。负债管理看比例不看绝对值。', time:'中', link:'dialogue-23.html'},
  {id:61, cat:'education', q:'不同目标的定投策略有什么不同？', a:'子女教育金（10-15年）：股债比60:40，月定投；退休金（20-30年）：股债比80:20，月定投+年调整；购房首付（3-5年）：股债比30:70，以债为主。目标不同，风险承受力不同，配置也不同。', time:'中', link:'dialogue-24A.html'},
  {id:62, cat:'invest', q:'定投需要根据市场变化调整吗？', a:'需要但不是频繁调整。建议一年一次再平衡——涨得多的部分卖一点补到跌得多的部分。定投的核心是\'不择时\'，但再平衡是\'主动管理风险\'。', time:'短', link:'dialogue-24A.html'},
  {id:63, cat:'invest', q:'怎么算出定投能不能达到目标？', a:'三步：①确定目标金额和时间；②用复利公式倒推月投金额；③调整收益率假设看可行性。关键：收益率假设不要太乐观（年化6-8%是合理预期），时间才是定投的朋友。', time:'短', link:'dialogue-24B.html'},
  {id:64, cat:'invest', q:'定投中途亏损怎么办？', a:'继续投，不要停。定投最大的优势就是越跌越买、摊低成本。如果在亏损时停止定投，就失去了这个优势。只要标的本身没问题（宽基指数），越跌越买是对的。', time:'短', link:'dialogue-24B.html'},
  {id:65, cat:'all', q:'资产配置的三大模型是什么？', a:'①美林时钟——按经济周期（衰退/复苏/过热/滞胀）配不同资产；②风险平价——让各类资产对组合的风险贡献均衡；③耶鲁模式——大量配置另类资产（私募股权、房地产）。三个模型的核心都是分散。', time:'中', link:'dialogue-25.html'},
  {id:66, cat:'all', q:'普通人应该用哪个模型？', a:'建议风险平价——最简单、最省心。核心原则：让每类资产对组合的风险贡献差不多。不需要判断经济周期，不需要选另类资产。用资产配置测算器输入自己的比例看看偏离度。', time:'短', link:'dialogue-25.html'},
  {id:67, cat:'retirement', q:'体育产业的财富逻辑对家庭理财有什么启示？', a:'三点启示：①球员的职业生涯就是家庭的理财缩影——收入高峰期要做好配置；②好的经纪人=好的财务顾问——选对人比选对产品重要；③NBA退休基金的强制储蓄机制值得每个家庭借鉴。', time:'中', link:'dialogue-26.html'},
  {id:68, cat:'all', q:'村超式财富管理是什么意思？', a:'低成本、高参与、可持续。不是每个人都能追求顶级联赛式的财富增长（高风险高收益），村超式的财富管理——稳健、与生活融为一体——更适合大多数家庭。找到自己的节奏比追逐别人的脚步更重要。', time:'中', link:'dialogue-26.html'},
  {id:69, cat:'all', q:'怎么区分真实价值和市场情绪？', a:'真实价值=这个资产本身能创造多少现金流；市场情绪=大家觉得它值多少。SpaceX的估值是真实的（它有实际收入和订单），而泡沫时期的公司只有故事没有现金流。买资产看真实价值，不要被情绪带偏。', time:'中', link:'dialogue-27.html'},
  {id:70, cat:'invest', q:'如何穿越市场周期？', a:'两件事：①建立机制而不是依赖意志力——定投自动执行、再平衡规则写死；②保持足够的保障金——让你在最艰难的时候不用被迫卖出。SpaceX经历过无数次濒临破产，但坚持下来的人最终获得了回报。', time:'中', link:'dialogue-27.html'},
  {id:71, cat:'invest', q:'端午节和投资有什么关系？', a:'屈原投江的本质是一次极端止损——他把自己的一切押在了楚怀王的信任上，没有分散，没有备份，没有Plan B。当这个单一资产归零时，他就只能选择极端退出。所以端午的第一课是——不要做屈原。要有Plan B，要有保障金，要分散配置。', time:'中', link:'dialogue-28.html'},
  {id:72, cat:'all', q:'粽子和资产配置有什么关系？', a:'粽叶、糯米、馅料就是一个完美的资产配置模型：糯米是基底（堡垒账户），馅料是增长（锋利账户），粽叶是风控（把一切包裹起来）。一个好的粽子，糯米不能太少，馅料不能太多，粽叶要扎紧——资产配置也一样。', time:'中', link:'dialogue-28.html'},
  {id:73, cat:'invest', q:'古代智慧和现代投资有什么关系？', a:'古人把智慧装在一个人身上（比如范蠡、王翦这样的天才），我们把它装进一套系统。《智囊》中的每一则故事都可以转化为一条可执行的家庭财富规则。天才不可复制，但原则可以。', time:'中', link:'dialogue-29.html'},
  {id:74, cat:'invest', q:'什么是"牛喘指标"？', a:'出自《智囊》中丙吉问喘的故事。宰相丙吉不管打架斗殴（噪音指标），只管牛喘气（杠杆指标）。在家庭财富管理中：噪音指标=每天的股价波动、基金净值变化；杠杆指标=你的负债率、现金流、保险覆盖。真正的高手盯着那几个杠杆指标。', time:'中', link:'dialogue-29.html'},
  {id:75, cat:'marriage', q:'家庭税务规划的四条跑道是哪四条？', a:'薪金、房产、投资、传承。同样的税前收入，不同的跑道安排，税后差距可能很大。薪金跑道的关键是专项附加扣除和年终奖规划；房产跑道关注持有税和交易税；投资跑道看股息红利和资本利得；传承跑道涉及赠与税和遗产税安排。', time:'中', link:'dialogue-30.html'},
  {id:76, cat:'retirement', q:'税后收益和税前收益能差多少？', a:'差距可能很大。同样是100万年收入，如果全部是工资薪金，扣除个税和社保后约70-75万。如果其中一部分是股息红利按20%税率计算或通过合规的税务规划安排，税后可能多出10-15万。关键是了解每条跑道的税率和政策。', time:'中', link:'dialogue-30.html'},
  {id:77, cat:'retirement', q:'金税四期对普通家庭有什么影响？', a:'金税四期实现了税务、银行、社保、海关等数据的全面打通。对普通家庭的影响：①个人账户大额流水会被监控；②境外汇款需要说明来源；③公私账户混同的风险加大。核心建议：保持收入申报与银行流水一致。', time:'中', link:'dialogue-31.html'},
  {id:78, cat:'all', q:'境外收入真的藏不住了吗？', a:'随着CRS（共同申报准则）在中国的落地实施，境外金融账户信息会自动交换回中国税务机关。2025年后，超过100个国家和地区参与CRS信息交换。境外收入、海外房产、离岸公司——只要在CRS参与国有金融账户，信息都会回来。', time:'中', link:'dialogue-31.html'},
  {id:79, cat:'invest', q:'家族传承的四层功课是什么？', a:'四层：传钱→传资产→传机制→传价值观。第一层是现金和金融资产，第二层是房产和企业股权，第三层是家族宪法和治理机制，第四层是家族精神和价值观。大多数家庭只做到第一层，但决定传承能否跨越代际的是第三和第四层。', time:'中', link:'dialogue-32.html'},
  {id:80, cat:'insurance', q:'三个传承阀门是哪三个？', a:'三个阀门：①法律阀门——遗嘱、信托、保险等法律工具的完备性；②税务阀门——传承过程中的税负成本和合规安排；③治理阀门——接班人的培养机制和家族决策规则。阀门没就绪，舵不交。', time:'中', link:'dialogue-32.html'},
  {id:81, cat:'liability', q:'修复家庭资产负债表的第一步是什么？', a:'先看负债端——清理有毒负债（消费贷、信用卡循环、网贷，利率10%-36%），再管理良性负债（房贷3%-5%），最后把灰色负债（亲友借款、担保）显性化。有毒负债是"癌细胞"，不切掉其他努力都会被利息吃掉。', time:'中', link:'dialogue-35.html'},
  {id:82, cat:'retirement', q:'自住房产到底是资产还是负债？', a:'双重属性。日常持有期是负债属性（每月物业费+税费+还贷，现金流净流出）；关键时刻（退休/危机/置换）是资产属性（可出售变现、可大换小增加现金储备、可出租产生租金，即处置期权价值）。', time:'中', link:'dialogue-35.html'},
  {id:83, cat:'all', q:'抗风险天数怎么算？多少算安全？', a:'公式：一级流动性 ÷ 日均生活支出。≥90天是基础安全线（中产家庭底线），≥180天是进阶安全线，≥360天是理想状态。注意只算"今天就能取出来的钱"，不包含股票、基金等需要变现的资产。', time:'中', link:'dialogue-35.html'},
  {id:84, cat:'invest', q:'怎么区分消费和投资？', a:'关键看这笔钱花完后还回不回来。消费是钱花出去就没了（吃饭、买包、旅行），投资是钱花出去还会回来甚至带更多回来（学习课程、健身、保险、资产配置）。花钱前问自己：这笔钱是在买短暂的满足，还是在买长期的自由？', time:'中', link:'dialogue-36.html'},
  {id:85, cat:'invest', q:'消费自检怎么做？', a:'四步法，每季度一次，每次一小时：第一步拉清单（导出所有流水按类别归类），第二步打标签（标为生存性/维持性/投资性），第三步问三个问题（值不值/重来还会花吗/跟人生规划有关吗），第四步调整预算。', time:'中', link:'dialogue-36.html'},
  {id:86, cat:'insurance', q:'应急金和保障金有什么区别？', a:'应急金是短期安全垫——6-12个月生活支出，应对失业医疗等突发，要求随时能取。保障金是长期安全垫——36个月生活支出，应对重病经济危机等长期冲击，可放在货币基金等流动性稍低的产品。先补应急金，再积累保障金。', time:'中', link:'dialogue-36.html'},
  {id:87, cat:'all', q:'等分的两周最该做什么？', a:'做四要素功课：①专业兴趣测评（喜欢什么、擅长什么）；②城市产业调研（哪个城市有你想做的行业）；③学校排名分析（目标专业的学科排名）；④就业前景摸底（毕业后的薪资和发展路径）。先算后判。', time:'中', link:'dialogue-gaokao.html'},
  {id:88, cat:'all', q:'专业、城市、学校怎么排序？', a:'建议顺序：专业40% > 城市30% > 学校20% > 其他10%。专业决定你未来20年的职业方向，城市决定实习和就业机会，学校决定起点高度。除非清北，否则专业>城市>学校。', time:'中', link:'dialogue-gaokao.html'},
  {id:89, cat:'marriage', q:'数字遗产怎么处理？', a:'数字遗产包括：社交媒体账号、云存储文件、加密货币、网上理财账户、游戏装备等。建议：①列一份数字资产清单；②把密码告诉一位可信的家人或写在遗嘱里；③了解各平台的身故账户处理政策（微信/支付宝都支持继承转移）。', time:'中', link:'wall-eaves-lower.html'},
  {id:90, cat:'invest', q:'数据出境红线是什么？', a:'《数据安全法》规定，重要数据和个人信息出境需要安全评估。对普通家庭的影响：①使用境外云盘存家庭照片可能有合规风险；②境外投资平台收集你的身份信息需确认其数据保护措施；③出国旅行时携带的电子设备可能被要求检查。', time:'中', link:'wall-eaves-lower.html'},
  {id:91, cat:'all', q:'家庭数据安全最容易被忽略的风险是什么？', a:'AI语音诈骗。不法分子用几分钟的语音样本就能克隆你的声音，然后打电话给你的家人假装借钱。2025年这类诈骗案例增长超300%。防护方法：和家人约定一个防诈暗号，任何大额转账前必须用暗号确认。', time:'中', link:'wall-eaves-upper.html'},
  {id:92, cat:'all', q:'CRS和税务数据泄露有什么关系？', a:'CRS要求金融机构向税务机关报送非居民的账户信息，这些数据在传输和存储过程中存在泄露风险。如果你的境外账户信息被泄露，可能被诈骗分子利用来进行精准诈骗。建议：定期检查自己的税务数据授权范围。', time:'中', link:'wall-eaves-upper.html'},
  {id:93, cat:'invest', q:'融资盘维持担保比例跌破130%会怎样？', a:'维持担保比例=担保物价值/融资负债。跌破130%券商会通知追加保证金或强制平仓。强制平仓不是"亏多少卖多少"，是券商按规则卖出——可能在最低点被清仓。所以融资盘的核心不是"会不会涨回来"，是"能不能撑到涨回来"。', time:'中', link:'roundtable-01.html'},
  {id:94, cat:'invest', q:'杠杆和价值投资能共存吗？', a:'理论上可以——巴菲特也用过杠杆。但实际操作中，杠杆会剥夺你的"时间权"：价值投资需要时间兑现，但杠杆有时间限制（利息+维保）。邓普顿的建议是：融资做逆向投资必须满足三前提——50%以上安全边际、3倍补仓现金、接受全亏。', time:'中', link:'roundtable-01.html'},
  {id:95, cat:'liability', q:'5.5%股息能覆盖3.0%房贷吗？', a:'数学上可以，2.5个点的利差25年滚下来可观。但要过三关：林奇关——5.5%是"真分红"还是"周期顶"？翻10年记录确认；凯恩斯关——股息砍30%+股价跌30%+收入断6个月，现金流还能撑吗？邓普顿关——留够2年生活费+2年月供的现金了吗？', time:'中', link:'roundtable-02.html'},
  {id:96, cat:'liability', q:'提前还贷的违约金一般是多少？', a:'通常为1-3个月利息，或按剩余本金的1%收取。部分银行设年度还款上限。决策前先跟贷款行确认合同条款——如果违约金太高，可能抵消了提前还贷节省的利息收益。', time:'短', link:'roundtable-02.html'},
  {id:97, cat:'all', q:'家族宪章要写哪四件事？', a:'勒维克教授的建议：①决策权——谁进委员会，投票权重怎么定（按代不按人头）；②分红规则——什么条件下分、每年最多分多少；③准入退出——成员结婚、离婚、欠债时股权怎么处理；④争议解决——仲裁机制。宪章保护关系，信托保护资产。', time:'中', link:'roundtable-03.html'},
  {id:98, cat:'all', q:'家庭财务"风险容量"怎么量化？', a:'霍华德·马克斯给的橡树四题：①主要收入断12个月，流动资产能覆盖多久？<12月=红；②组合回撤30%是否需要削减刚性支出？是=红；③有无≥18个月刚性支出的现金舱？无=红；④浮动利率负债占比>30%？是=黄。四题全绿才谈进取配置。', time:'中', link:'roundtable-03.html'},
  {id:99, cat:'invest', q:'"右侧交易"在家庭投资里怎么用？', a:'米勒维尼的降维版"家庭右侧三原则"：①不抄底，只等趋势确认（站上200日均线+均线向上）再参与；②分批不梭哈，分3-4批进，间隔1-2个月；③移动止盈不设硬止损——从高点回撤15%减1/3锁利润。家庭不是对冲基金，先求不死再求赢。', time:'中', link:'roundtable-03.html'},
  {id:100, cat:'invest', q:'夫妻财务分歧怎么用"三步降温法"化解？', a:'韦伯教授的临床实证方法：①命名情绪——"我现在是防御态"，命名本身就能降杏仁核活跃度15-20%；②外化问题——"不是你vs我，是这笔钱怎么配"；③小步共识——先从不争议的10%达成共识，再扩到90%。', time:'短', link:'roundtable-03.html'},
  {id:101, cat:'invest', q:'AI估值400倍PE还能不能买？', a:'格林沃尔德说400倍PE已不在价值投资射程——算不出内在价值，安全边际没地方挂。霍华德说等双杀三信号：高收益债利差>500bp、NASDAQ回撤>30%、龙头指引miss。达利欧说这是泡沫晚期。', time:'中', link:'roundtable-04.html'},
  {id:102, cat:'invest', q:'普通人怎么参与AI投资？', a:'扎克的三层敞口法：核心仓60%买AI基础设施（云、算力）；卫星仓30%买宽AI ETF；现金10%留弹药。最忌讳"all-in某AI小票+融资"。', time:'短', link:'roundtable-04.html'},
  {id:103, cat:'invest', q:'安全边际该不该随周期调整？', a:'马克斯vs格林沃尔德的共识：A类资产（护城河深+现金流稳）用恒定7折；B类资产（周期/赛道）用周期尺——高位6-5折。A类看公司，B类看周期。', time:'短', link:'roundtable-05.html'},
  {id:104, cat:'invest', q:'科技颠覆时代护城河还成立吗？', a:'格林沃尔德：护城河的本质不是"公司在做什么"，是"客户为什么离不开它"。三问：①3年后商业模式还在吗？②ROIC持续高于WACC？③特许经营权谁护着？', time:'短', link:'roundtable-05.html'},
];

</script>
<script>
let currentTag = 'all';
const CATEGORY_NAMES = {
  'all':'全部', 'marriage':'婚姻财产', 'education':'子女教育', 'retirement':'养老规划',
  'invest':'投资困惑', 'insurance':'保险配置', 'liability':'债务管理', 'tax':'税务筹划',
  'estate':'传承规划', 'housing':'买房租房', 'budget':'预算消费', 'other':'其他'
};
const CATEGORY_ORDER = ['all','marriage','education','retirement','invest','insurance','liability','tax','estate','housing','budget','other'];
const CATEGORY_ICONS = {all:'📋',marriage:'💍',education:'🎓',retirement:'🌅',invest:'📈',insurance:'🛡️',liability:'⚖️',tax:'🧾',estate:'📜',housing:'🏠',budget:'📊',other:'💡'};

function initTags(){
  const c = document.getElementById('tagContainer');
  CATEGORY_ORDER.forEach(k=>{
    const span = document.createElement('span');
    span.className = 'tag-btn' + (k==='all'?' active':'');
    span.textContent = (CATEGORY_ICONS[k]||'') + ' ' + (CATEGORY_NAMES[k]||k);
    span.setAttribute('data-tag',k);
    span.onclick = ()=>{switchTag(k)};
    c.appendChild(span);
  });
}

function switchTag(tag){
  currentTag = tag;
  document.querySelectorAll('.tag-btn').forEach(b=>b.classList.toggle('active',b.getAttribute('data-tag')===tag));
  filterFAQs();
}

function getCategoryCounts(){
  const counts = {};
  triageFAQs.forEach(item=>{
    const cats = item.cat.split(',');
    cats.forEach(c=>{counts[c]=(counts[c]||0)+1});
  });
  return counts;
}

function renderStats(){
  const counts = getCategoryCounts();
  const c = document.getElementById('statsContainer');
  c.innerHTML = '';
  CATEGORY_ORDER.forEach(k=>{
    if(k==='all' || !counts[k]) return;
    const d = document.createElement('div'); d.className = 'stat-card';
    d.innerHTML = `<div class="stat-num">${counts[k]}</div><div class="stat-label">${CATEGORY_ICONS[k]||''} ${CATEGORY_NAMES[k]||k}</div>`;
    c.appendChild(d);
  });
}

function filterFAQs(){
  const q = document.getElementById('searchInput').value.toLowerCase();
  const list = document.getElementById('faqList');
  let count = 0;
  list.innerHTML = '';
  triageFAQs.forEach(item=>{
    const cats = item.cat.split(',');
    const matchTag = currentTag==='all' || cats.includes(currentTag);
    const matchSearch = !q || item.q.toLowerCase().includes(q) || item.a.toLowerCase().includes(q);
    if(!matchTag || !matchSearch) return;
    count++;
    const div = document.createElement('div'); div.className = 'faq-item';
    div.innerHTML = `
      <div class="faq-q" onclick="this.parentElement.classList.toggle('open')">
        <span>${item.q}</span>
        <span class="arrow">▾</span>
      </div>
      <div class="faq-a">${item.a}</div>
      <div class="faq-meta">⏱ ${item.time || '短'} · ${item.link ? '<a href="'+item.link+'">相关对话 →</a>' : ''}</div>
    `;
    list.appendChild(div);
  });
  document.getElementById('counter').textContent = count + ' 个问题';
  document.getElementById('noResult').style.display = count===0 ? 'block' : 'none';
}

// 读取URL参数 ?q= 并自动搜索
(function(){
  const params = new URLSearchParams(window.location.search);
  const q = params.get('q');
  if(q){
    document.getElementById('searchInput').value = q;
    filterFAQs();
  }
})();

initTags();
renderStats();
filterFAQs();
</script>
