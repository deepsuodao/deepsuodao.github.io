<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>研究十诫自检 — 私家智囊</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Helvetica Neue", sans-serif; background: #0f1424; color: #e8e6e3; line-height: 1.7; min-height: 100vh; }
.container { max-width: 820px; margin: 0 auto; padding: 24px 20px 60px; }
.header { text-align: center; padding: 30px 0 20px; border-bottom: 1px solid rgba(212,168,83,.15); margin-bottom: 30px; }
.header h1 { font-size: 1.6rem; font-weight: 400; color: #d4a853; margin-bottom: 8px; letter-spacing: .03em; }
.header p { color: #8a8885; font-size: .88rem; }
.card { background: #1a1f30; border-radius: 4px; padding: 24px 20px; margin-bottom: 16px; border: 1px solid rgba(212,168,83,.12); }
.card-title { font-size: 1rem; font-weight: 500; color: #d4a853; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.input-group { margin-bottom: 16px; }
.input-label { display: block; font-size: .82rem; color: #b0aeab; margin-bottom: 6px; }
.input-label .hint { color: #6a6865; font-size: .75rem; margin-left: 6px; }
input[type="text"], textarea, select { width: 100%; padding: 10px 12px; font-size: .92rem; background: #232840; border: 1px solid #3a3f55; border-radius: 4px; color: #e8e6e3; outline: none; transition: border-color .3s; font-family: inherit; }
input[type="text"]:focus, textarea:focus, select:focus { border-color: #d4a853; background: #2a2f48; }
textarea { min-height: 80px; resize: vertical; }
.btn { display: inline-block; padding: 12px 32px; font-size: .92rem; background: #d4a853; color: #0a0e1a; border: none; border-radius: 4px; cursor: pointer; font-weight: 500; transition: background .3s; }
.btn:hover { background: #f0c868; }
.btn-block { display: block; width: 100%; }
.commandment { background: rgba(255,255,255,.02); border-radius: 4px; padding: 18px; margin-bottom: 12px; border-left: 3px solid #3a3f55; transition: border-color .3s; }
.commandment.pass { border-left-color: #4caf50; }
.commandment.warn { border-left-color: #ff9800; }
.commandment.fail { border-left-color: #f44336; }
.commandment-q { font-size: .92rem; color: #d4a853; margin-bottom: 6px; font-weight: 500; }
.commandment-h { font-size: .82rem; color: #8a8885; margin-bottom: 10px; }
.choice-group { display: flex; gap: 8px; flex-wrap: wrap; }
.choice { flex: 1; min-width: 80px; padding: 8px 10px; text-align: center; background: #232840; border: 1px solid #3a3f55; border-radius: 3px; cursor: pointer; font-size: .82rem; color: #b0aeab; transition: all .2s; }
.choice:hover { border-color: #d4a853; color: #d4a853; }
.choice.active.pass { background: rgba(76,175,80,.15); border-color: #4caf50; color: #4caf50; }
.choice.active.warn { background: rgba(255,152,0,.15); border-color: #ff9800; color: #ff9800; }
.choice.active.fail { background: rgba(244,67,54,.15); border-color: #f44336; color: #f44336; }
.result-section { background: linear-gradient(180deg,#1a1f30 0%,#1f2440 100%); border: 1px solid rgba(212,168,83,.15); border-radius: 4px; padding: 30px 24px; text-align: center; margin: 24px 0; }
.result-label { font-size: .82rem; color: #8a8885; margin-bottom: 10px; letter-spacing: .05em; }
.result-value { font-size: clamp(2.5rem,5vw,4rem); font-weight: 300; color: #d4a853; margin-bottom: 8px; }
.result-sub { font-size: .9rem; color: #8a8885; }
.grade { display: inline-block; padding: 4px 16px; border-radius: 3px; font-size: .9rem; margin-top: 10px; }
.grade-A { background: rgba(76,175,80,.15); color: #4caf50; border: 1px solid #4caf50; }
.grade-B { background: rgba(212,168,83,.15); color: #d4a853; border: 1px solid #d4a853; }
.grade-C { background: rgba(255,152,0,.15); color: #ff9800; border: 1px solid #ff9800; }
.grade-D { background: rgba(244,67,54,.15); color: #f44336; border: 1px solid #f44336; }
.warn-list { background: rgba(244,67,54,.04); border-left: 3px solid #f44336; padding: 14px 18px; border-radius: 3px; margin: 16px 0; }
.warn-list h4 { color: #f44336; font-size: .9rem; margin-bottom: 8px; }
.warn-list li { font-size: .85rem; color: #b0aeab; margin-bottom: 4px; list-style: none; padding-left: 16px; position: relative; }
.warn-list li::before { content: "→"; position: absolute; left: 0; color: #f44336; }
.footer { text-align: center; padding: 30px 0 10px; font-size: .8rem; color: #6a6865; }
.footer a { color: #d4a853; text-decoration: none; }
.hidden { display: none; }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📋 研究十诫自检</h1>
        <p>一个方法在被投入真金白银之前，应该先过的十道关卡</p>
        <p style="color:#6a6865; font-size:.78rem; margin-top:6px;">对应研究 04《怎么杀死一个看起来很赚的策略》</p>
    </div>

    <div class="card">
        <div class="card-title">💬 先说说你想检验的方法</div>
        <div class="input-group">
            <label class="input-label">方法/策略名称 <span class="hint">(选填,便于记忆)</span></label>
            <input type="text" id="method-name" placeholder="例:按股息率5%门槛建仓的策略">
        </div>
        <div class="input-group">
            <label class="input-label">方法简介 <span class="hint">(简要说清规则和数据)</span></label>
            <textarea id="method-desc" placeholder="例:用过去12个月股息率÷当前股价,达到5%就建仓,跌破3.5%就清仓。数据来自Wind,2007-2026年20只高股息标的。"></textarea>
        </div>
    </div>

    <div class="card">
        <div class="card-title">⚖️ 十道关卡 (逐项选择)</div>
        <p style="font-size:.8rem; color:#8a8885; margin-bottom:16px;">每条选"通过" / "部分通过" / "未通过" / "未涉及",最后给出综合评估。</p>

        <div id="commandments"></div>

        <button class="btn btn-block" onclick="evaluate()">查看评估结果</button>
    </div>

    <div id="result" class="hidden">
        <div class="result-section">
            <div class="result-label">综合评分</div>
            <div class="result-value" id="score">--</div>
            <div class="result-sub">通过率 <span id="passrate">--</span></div>
            <div id="grade-display" class="grade grade-D">D 级</div>
            <div style="margin-top:18px; padding-top:18px; border-top:1px solid rgba(212,168,83,.12); font-size:.85rem; color:#8a8885; line-height:1.7;" id="grade-advice"></div>
        </div>

        <div class="card">
            <div class="card-title">📊 各关卡得分明细</div>
            <div id="detail"></div>
        </div>

        <div class="warn-list" id="critical-warn" style="display:none;">
            <h4>🚨 致命缺陷 (任一条不通过都不应投入真金白银)</h4>
            <ul id="critical-list"></ul>
        </div>

        <div class="card">
            <div class="card-title">🎯 下一步建议</div>
            <ol style="padding-left:24px; font-size:.88rem; color:#b0aeab; line-height:1.9;" id="next-actions"></ol>
        </div>
    </div>

    <div class="footer">
        <p>📊 <a href="research.html">返回研究报告</a> · 数据本地计算 · 不上传任何信息</p>
        <p style="margin-top:6px;">来源:研究 04《怎么杀死一个看起来很赚的策略》</p>
    </div>
</div>

<script>
const COMMANDMENTS = [
    { id: 1, q: "第1诫:数据地基合格", h: "数据来源是否可信?样本是否包含已退市标的?停牌/涨跌停是否处理?", c: "数据是地基,地基不合格,上面算什么都没意义" },
    { id: 2, q: "第2诫:没有'未来函数'", h: "是否用了'当时还不知道'的信息?例如用全年净利润决定1月该不该买。", c: "不产生报错,只产生漂亮的结果——最危险的一种" },
    { id: 3, q: "第3诫:没有幸存者偏差", h: "样本里是否包含已退市/破产/被吸收合并的标的?还是只统计活到今天的?", c: "只采访还活着的公司,调查不出创业成功率" },
    { id: 4, q: "第4诫:标准在跑数前已写死", h: "判定'什么算通过'是否在看结果之前就冻结?结果不好时是否改过标准?", c: "标准必须在看结果之前就写死并冻结" },
    { id: 5, q: "第5诫:赚钱与控风险分开检验", h: "是否分别检验'赚得多'和'亏得少'?还是只看一个综合指标?", c: "'会少亏'和'会多赚'是两件事,常被混为一谈" },
    { id: 6, q: "第6诫:扣掉成本后还成立", h: "佣金/印花税/滑点/冲击成本是否全部计入?是否用毛收益偷偷跑过?", c: "成本后置,它就变成最后一根救命稻草" },
    { id: 7, q: "第7诫:参数少,举证责任轻", h: "需要多少参数才成立?是否用参数优化/网格搜索挑出来的?", c: "参数越多,'恰好适应这段历史'的可能性越大" },
    { id: 8, q: "第8诫:有独立反方复核", h: "是否有'不认同你假设'的人独立重算过一次?是否写成制度?", c: "如果反方什么都没发现,才该担心" },
    { id: 9, q: "第9诫:知道它为什么有效", h: "是否能说清这个方法为什么赚钱?如果说不清,失效时也不知道。", c: "说不清为什么有效,就无法知道何时失效" },
    { id: 10, q: "第10诫:目标不是找到永远对的", h: "是否在追求'排除错误'而不是'证明正确'?是否给这个方法写过'什么情况下算失败'?", c: "这是总纲——其余九条都是它的具体表现" }
];

const GRADES = {
    A: { min: 95, label: "A 级 — 高信任", color: "grade-A", advice: "这个方法已经过严格审计,可以进入下一步(如模拟盘跟踪或小仓位实盘)。<strong>但这不是'证明正确'——只是'目前未被推翻'</strong>。继续保留独立的反方复核。" },
    B: { min: 80, label: "B 级 — 可继续", color: "grade-B", advice: "这个方法大体通过,但有几处需要补强。<strong>优先修补未通过或部分通过的项目</strong>。在修补完成前,不要投入新增资金。" },
    C: { min: 60, label: "C 级 — 需要修补", color: "grade-C", advice: "存在多处需要修补的缺陷。<strong>当前不应进入实盘</strong>。修补后重新走一遍十诫。" },
    D: { min: 0, label: "D 级 — 不应使用", color: "grade-D", advice: "存在致命缺陷或大量未通过项。<strong>强烈不建议任何实盘使用</strong>。即使修补,也要重新预注册后从第一步开始。" }
};

const CRITICAL = [2, 3, 4, 8]; // 致命:第2/3/4/8条

function init() {
    const container = document.getElementById('commandments');
    container.innerHTML = COMMANDMENTS.map(c => `
        <div class="commandment" id="cmd-${c.id}">
            <div class="commandment-q">${c.q}</div>
            <div class="commandment-h">${c.h} — <em style="color:#8a8885;">${c.c}</em></div>
            <div class="choice-group">
                <div class="choice" data-cmd="${c.id}" data-val="pass" onclick="selectChoice(this)">✅ 通过</div>
                <div class="choice" data-cmd="${c.id}" data-val="warn" onclick="selectChoice(this)">⚠️ 部分</div>
                <div class="choice" data-cmd="${c.id}" data-val="fail" onclick="selectChoice(this)">❌ 未通过</div>
                <div class="choice" data-cmd="${c.id}" data-val="na" onclick="selectChoice(this)">➖ 不适用</div>
            </div>
        </div>
    `).join('');
}

function selectChoice(el) {
    const cmdId = el.dataset.cmd;
    document.querySelectorAll(`[data-cmd="${cmdId}"]`).forEach(e => e.classList.remove('active', 'pass', 'warn', 'fail'));
    el.classList.add('active');
    if (el.dataset.val === 'pass') el.classList.add('pass');
    else if (el.dataset.val === 'warn') el.classList.add('warn');
    else if (el.dataset.val === 'fail') el.classList.add('fail');
    el.dataset.cmdValue = el.dataset.val;
}

function evaluate() {
    const results = [];
    let pass = 0, warn = 0, fail = 0, na = 0, applicable = 0, score = 0;
    const criticalFails = [];

    COMMANDMENTS.forEach(c => {
        const val = document.querySelector(`[data-cmd="${c.id}"].active`)?.dataset.val || 'na';
        results.push({ id: c.id, val, q: c.q });
        if (val === 'pass') { pass++; applicable++; score += 1.0; }
        else if (val === 'warn') { warn++; applicable++; score += 0.5; }
        else if (val === 'fail') {
            fail++; applicable++;
            if (CRITICAL.includes(c.id)) criticalFails.push(c.q);
        } else { na++; }
    });

    const total = COMMANDMENTS.length;
    const denom = total - na;
    const passRate = denom > 0 ? Math.round((score / denom) * 100) : 0;
    const finalScore = passRate;

    // 定级
    let grade = 'D';
    Object.keys(GRADES).reverse().forEach(k => { if (finalScore >= GRADES[k].min) grade = k; });

    // 致命缺陷强制降级
    if (criticalFails.length > 0) grade = 'D';

    // 显示结果
    document.getElementById('result').classList.remove('hidden');
    document.getElementById('score').textContent = finalScore;
    document.getElementById('passrate').textContent = `${passRate}% (通过 ${pass}, 部分 ${warn}, 未通过 ${fail}, 不适用 ${na})`;

    const gradeEl = document.getElementById('grade-display');
    gradeEl.className = `grade ${GRADES[grade].color}`;
    gradeEl.textContent = GRADES[grade].label;

    document.getElementById('grade-advice').innerHTML = GRADES[grade].advice;

    // 详情
    const detailEl = document.getElementById('detail');
    detailEl.innerHTML = results.map(r => {
        const c = COMMANDMENTS.find(x => x.id === r.id);
        const colorMap = { pass: '#4caf50', warn: '#ff9800', fail: '#f44336', na: '#6a6865' };
        const valText = { pass: '通过', warn: '部分', fail: '未通过', na: '不适用' }[r.val];
        return `<div style="display:flex; align-items:center; padding:8px 0; border-bottom:1px dashed rgba(255,255,255,.05); font-size:.85rem;">
            <span style="color:${colorMap[r.val]}; font-weight:500; width:60px;">${valText}</span>
            <span style="color:#b0aeab; flex:1;">${c.q.replace(/^第\d+诫:/, '')}</span>
        </div>`;
    }).join('');

    // 致命警告
    const warnDiv = document.getElementById('critical-warn');
    if (criticalFails.length > 0) {
        warnDiv.style.display = 'block';
        document.getElementById('critical-list').innerHTML = criticalFails.map(q => `<li>${q}</li>`).join('');
    } else {
        warnDiv.style.display = 'none';
    }

    // 下一步建议
    const actions = [];
    if (grade === 'D') actions.push('<strong>不要进入实盘。</strong>致命缺陷必须先修补。');
    else if (grade === 'C') actions.push('补强未通过项目,完成后重新评估。');
    else if (grade === 'B') actions.push('修补"部分通过"项,然后进入模拟盘跟踪(至少6个月)。');
    else actions.push('可进入小仓位实盘,但保持独立反方复核,任何参数调整需重新预注册。');

    if (fail > 0) actions.push(`<strong>未通过项(${fail}条):</strong>逐项写明原因,3个月内补做或写"放弃"声明。`);
    if (warn > 0) actions.push(`<strong>部分通过项(${warn}条):</strong>梳理为"待修补清单",每条写明验收标准。`);
    if (na > 0) actions.push(`<strong>不适用项(${na}条):</strong>确认是否真不适用——若方法会用到该项,应改为"未通过"。`);
    actions.push('保存本次评估结果,作为后续审计的基线。');
    actions.push('如要进一步推进,生成"预注册文档"(对应研究 05) → 写明"什么算失败",再开始数据采集。');

    document.getElementById('next-actions').innerHTML = actions.map(a => `<li>${a}</li>`).join('');

    document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
}

init();
</script>
</body>
</html>
