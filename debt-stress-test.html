<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="家庭负债压力测试 — 三模块评估：现金流覆盖度、利率风险承受力、资产偿债能力。先测后判，让负债成为工具而非负担。">
<meta property="og:title" content="负债压力测试 - 私家智囊工具箱">
<meta property="og:description" content="三模块评估家庭负债健康度：月供收入比、利率上升压力测试、资产覆盖率。先测后判，让数字说话。">
<meta property="og:image" content="https://deepsuodao.github.io/images/dialogue-scene.jpg">
<meta property="og:type" content="website">
<meta property="og:url" content="https://deepsuodao.github.io/debt-stress-test.html">

    <title>负债压力测试 - 私家智囊工具箱</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family:-apple-system,"PingFang SC","Noto Sans SC","Helvetica Neue",sans-serif;
            background:#0f1424;
            color:#e8e6e3;
            line-height:1.7;
            -webkit-font-smoothing:antialiased;
            min-height:100vh;
            padding:0
        }
        
        a{color:#d4a853;text-decoration:none;transition:color .3s}
        a:hover{color:#f0c868}
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding:0 20px 40px
        }
        
        .header {
            text-align:center;
            padding:32px 0 20px;
            color:#e8e6e3;
            margin-bottom:0
        }
        
        .header h1 {
            font-size:clamp(1.4rem,3.5vw,2rem);
            font-weight:400;
            color:#d4a853;
            letter-spacing:-.02em;
            margin-bottom:4px
        }
        
        .header .subtitle {
            font-size:.82rem;
            color:#8a8885
        }
        
        .card {
            background:#1a1f30;
            border-radius:4px;
            padding:24px 20px;
            margin-bottom:16px;
            border:1px solid rgba(212,168,83,.12);
            transition:border-color .3s;
            box-shadow:none
        }
        .card:hover{border-color:rgba(212,168,83,.25)}
        
        .card-title {
            font-size:.95rem;
            font-weight:500;
            color:#d4a853;
            margin-bottom:16px;
            display:flex;
            align-items:center;
            gap:8px;
            letter-spacing:.02em
        }
        .card-title span{font-size:1.2rem}
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
        }
        
        .input-label .hint {
            font-weight: 400;
            color: #999;
            font-size: 12px;
            margin-left: 8px;
        }
        
        input[type="number"], input[type="text"], select {
            width:100%;padding:12px 14px;font-size:.95rem;
            background:#232840;border:1px solid #3a3f55;border-radius:4px;
            color:#e8e6e3;outline:none;transition:border-color .3s,background .3s;
            font-family:inherit
        }
        input:focus, select:focus{border-color:#d4a853;background:#2a2f48}
        input::placeholder{color:#5a5855}
        select{appearance:auto;cursor:pointer}
        
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        @media (max-width: 768px) {
            .row {
                grid-template-columns: 1fr;
            }
        }
        
        .toggle-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #f0f0f0;
        }
        
        .toggle-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 14px;
            color: #667eea;
            font-weight: 500;
        }
        
        .toggle-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
        }
        
        .hidden {
            display: none;
        }
        
        .optional-badge {
            display: inline-block;
            background: #f0f0f0;
            color: #666;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 8px;
        }
        
        .hint-box {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #666;
            line-height: 1.6;
        }
        
        .result-section {
            margin-top: 30px;
        }
        
        .result-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            padding: 40px 30px;
            color: white;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .result-label {
            font-size: 16px;
            margin-bottom: 10px;
            opacity: 0.9;
        }
        
        .result-value {
            font-size: 72px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .result-unit {
            font-size: 24px;
            font-weight: 400;
        }
        
        .result-status {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 15px;
        }
        
        .progress-bar {
            width: 100%;
            height: 12px;
            background: rgba(255,255,255,0.3);
            border-radius: 6px;
            overflow: hidden;
            margin: 20px 0;
        }
        
        .progress-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 1s ease-in-out;
        }
        
        .progress-fill.green { background: #10b981; }
        .progress-fill.yellow { background: #f59e0b; }
        .progress-fill.red { background: #ef4444; }
        
        .source-breakdown {
            margin-top: 25px;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
        }
        
        .source-title {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 15px;
        }
        
        .source-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .source-item:last-child {
            border-bottom: none;
            font-weight: 600;
            color: #1a1a2e;
        }
        
        .source-name {
            font-size: 14px;
            color: #666;
        }
        
        .source-value {
            font-size: 14px;
            font-weight: 500;
            color: #1a1a2e;
        }
        
        .scenario-section {
            margin-top: 25px;
        }
        
        .scenario-title {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 15px;
        }
        
        .scenario-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .scenario-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        
        .scenario-label {
            font-size: 13px;
            color: #666;
            margin-bottom: 5px;
        }
        
        .scenario-value {
            font-size: 20px;
            font-weight: 600;
            color: #1a1a2e;
        }
        
        .scenario-value.green { color: #10b981; }
        .scenario-value.yellow { color: #f59e0b; }
        .scenario-value.red { color: #ef4444; }
        
        .benchmark-section {
            margin-top: 25px;
            background: #f0f9ff;
            border-radius: 12px;
            padding: 20px;
            border-left: 4px solid #0ea5e9;
        }
        
        .benchmark-title {
            font-size: 16px;
            font-weight: 600;
            color: #0c4a6e;
            margin-bottom: 12px;
        }
        
        .benchmark-item {
            font-size: 14px;
            color: #0c4a6e;
            line-height: 1.8;
        }
        
        .recommendations {
            margin-top: 25px;
            background: #f0fdf4;
            border-radius: 12px;
            padding: 20px;
            border-left: 4px solid #10b981;
        }
        
        .recommendations h4 {
            font-size: 16px;
            font-weight: 600;
            color: #065f46;
            margin-bottom: 12px;
        }
        
        .recommendations ul {
            list-style: none;
            padding: 0;
        }
        
        .recommendations li {
            padding: 8px 0;
            padding-left: 24px;
            position: relative;
            font-size: 14px;
            color: #065f46;
            line-height: 1.6;
        }
        
        .recommendations li:before {
            content: "→";
            position: absolute;
            left: 0;
            font-weight: 600;
        }
        
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            color: rgba(255,255,255,0.8);
            font-size: 13px;
        }
        
        .concept-box {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }
        
        .concept-title {
            font-size: 15px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 8px;
        }
        
        .concept-text {
            font-size: 13px;
            color: #666;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💳 负债压力测试</h1>
            <div class="subtitle">对应守夜人底线②③：负债与安全边际 → 测试极端情况下的财务抗压能力</div>
        </div>
        
        <div class="card">
            <div class="card-title">
                <span>📊</span>
                <span>基本信息输入</span>
            </div>
            
            <div class="hint-box">
                💡 以下3项为必填项，填写后即可看到核心评估结果。下方"选填项"填得越全，压力测试越精准。
            </div>
            
            <div class="row">
                <div class="input-group">
                    <label class="input-label">家庭月总收入 <span class="hint">（税后，含工资+被动收入）</span></label>
                    <input type="number" id="monthlyIncome" placeholder="如：30000" oninput="calculate()">
                </div>
                
                <div class="input-group">
                    <label class="input-label">家庭月还款总额 <span class="hint">（所有贷款月供之和）</span></label>
                    <input type="number" id="monthlyRepayment" placeholder="如：15000" oninput="calculate()">
                </div>
            </div>
            
            <div class="input-group">
                <label class="input-label">可速兑金融资产 <span class="hint">（7天内可赎回，必填）</span></label>
                <input type="number" id="liquidAssets" placeholder="如：200000" oninput="calculate()">
            </div>
            
            <div class="toggle-section">
                <label class="toggle-label" onclick="toggleOptional()">
                    <input type="checkbox" id="showOptional">
                    <span>选填项（填越全算越准）<span class="optional-badge">可选</span></span>
                </label>
                
                <div id="optionalSection" class="hidden" style="margin-top: 20px;">
                    <div class="input-group">
                        <label class="input-label">对外担保金额 <span class="hint">（如有，填总额）</span></label>
                        <input type="number" id="guaranteeAmount" placeholder="如：0" oninput="calculate()">
                    </div>
                    
                    <div class="toggle-section">
                        <label class="toggle-label">
                            <input type="checkbox" id="hasMortgage" onchange="toggleMortgage()">
                            <span>我有房贷（用于房价下跌情景测试）</span>
                        </label>
                        
                        <div id="mortgageSection" class="hidden" style="margin-top: 15px;">
                            <div class="row">
                                <div class="input-group">
                                    <label class="input-label">房产总价值 <span class="hint">（当前估值）</span></label>
                                    <input type="number" id="houseValue" placeholder="如：5000000" oninput="calculate()">
                                </div>
                                
                                <div class="input-group">
                                    <label class="input-label">房贷剩余本金 <span class="hint">（未还本金）</span></label>
                                    <input type="number" id="mortgageBalance" placeholder="如：3000000" oninput="calculate()">
                                </div>
                            </div>
                            
                            <div class="input-group" style="margin-top: 15px;">
                                <label class="toggle-label">
                                    <input type="radio" name="houseType" value="self" checked onchange="calculate()">
                                    <span>自住（不影响现金流，影响心情）</span>
                                </label>
                                <label class="toggle-label" style="margin-top: 10px;">
                                    <input type="radio" name="houseType" value="investment" onchange="calculate()">
                                    <span>投资（压力巨大，可能强平）</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card result-section" id="resultCard">
            <div class="card-title">
                <span>🎯</span>
                <span>核心指标评估</span>
            </div>
            
            <div class="metrics-grid" id="metricsGrid">
                <!-- 动态生成 -->
            </div>
            
            <div class="score-section" id="scoreSection">
                <!-- 动态生成 -->
            </div>
        </div>
        
        <div class="card scenario-section">
            <div class="card-title">
                <span>⚠️</span>
                <span>压力测试情景</span>
            </div>
            
            <div class="scenario-tabs">
                <div class="scenario-tab active" onclick="switchScenario('rate', this)">利率上升</div>
                <div class="scenario-tab" onclick="switchScenario('income', this)">收入下降</div>
                <div class="scenario-tab" onclick="switchScenario('liquidity', this)">紧急变现</div>
                <div class="scenario-tab" onclick="switchScenario('guarantee', this)">担保触发</div>
                <div class="scenario-tab" onclick="switchScenario('houseprice', this)">房价下跌</div>
            </div>
            
            <div class="scenario-content" id="scenarioContent">
                <!-- 动态生成 -->
            </div>
        </div>
        
        <button class="save-btn" onclick="saveResult()">💾 保存测试结果</button>
        
        <div class="site-footer">
            <p class="slogan">家庭财富的<span>规划师</span>与<span>守夜人</span></p>
            <p class="copyright">私家智囊 · 数据本地计算，不上传服务器</p>
        </div>
    </div>
    
    <script>
</html>
