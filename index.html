<script>
// === Mini Checkup ===
var mcAnswers = {};
function mcSelect(el) {
  var q = el.getAttribute('data-q');
  var v = el.getAttribute('data-v');
  var siblings = el.parentElement.querySelectorAll('.mc-option');
  siblings.forEach(function(s) { s.className = 'mc-option'; });
  el.classList.add('selected-' + v);
  mcAnswers[q] = v;
  if (mcAnswers['1'] && mcAnswers['2'] && mcAnswers['3']) { showMcResult(); }
}

function showMcResult() {
  var result = document.getElementById('mc-result');
  var verdict = document.getElementById('mc-verdict');
  var detail = document.getElementById('mc-detail');
  var cta = document.getElementById('mc-cta');
  var vals = [mcAnswers['1'], mcAnswers['2'], mcAnswers['3']];
  var redCount = vals.filter(function(v){return v==='red'}).length;
  var yellowCount = vals.filter(function(v){return v==='yellow'}).length;

  var level, verdictText, detailText, ctaClass;
  if (redCount >= 2) {
    level = 'red';
    verdictText = '🔴 您的信心有缺口——机制还没建起来';
    detailText = '您的家庭财务还在靠意志力和经验判断。建议从五格结构图开始，把三个机制一一落地——保障金锁住、复利启动、底线设好。';
  } else if (redCount === 1 || yellowCount >= 2) {
    level = 'yellow';
    verdictText = '🟡 您的信心有意识，但缺机制支撑';
    detailText = '您已经有了部分基础，但还没有形成完整的机制。用五格结构图画出当前布局，看看哪些格子是空的——空着的格子，就是机制缺口。';
  } else {
    level = 'green';
    verdictText = '🟢 您的家庭信心有机制支撑';
    detailText = '您的家庭财务已经有了机制雏形。继续用八问自检做更精细的校准，保持守夜人放心值——机制不是一次建好的，是持续校准的。';
  }

  verdict.textContent = verdictText;
  verdict.className = 'mc-verdict ' + level;
  detail.textContent = detailText;
  cta.href = 'five-grid.html';
  cta.className = 'mc-cta ' + level;
  cta.textContent = level === 'green' ? '继续校准 → 五格结构图' : '开始建机制 → 五格结构图';
  result.classList.add('show');
  localStorage.setItem('mcResult', level);
  localStorage.setItem('mcDate', new Date().toISOString());
}

  var rest = document.getElementById('dialogue-rest');
  var btn = document.getElementById('expand-dialogues');
  if (rest.style.display === 'none') {
    rest.style.display = '';
    btn.textContent = '收起对话列表 ↑';
  } else {
    rest.style.display = 'none';
    btn.textContent = '展开全部对话（共 23 篇）↓';
  }
}

// === Filter Tags ===
document.querySelectorAll('#filter-tags .filter-btn').forEach(function(btn){
  btn.addEventListener('click', function(){
    var filter = this.getAttribute('data-filter');
    document.querySelectorAll('#filter-tags .filter-btn').forEach(function(b){ b.classList.remove('active'); });
    this.classList.add('active');
    var rest = document.getElementById('dialogue-rest');
    var expandBtn = document.getElementById('expand-dialogues');
    if (filter !== 'all' && rest.style.display === 'none') {
      rest.style.display = '';
      expandBtn.textContent = '收起对话列表 ↑';
    }
    ['dialogue-featured', 'dialogue-rest'].forEach(function(listId){
      var list = document.getElementById(listId);
      if (!list) return;
      list.querySelectorAll('.dialogue-card').forEach(function(card){
        if(filter === 'all'){ card.style.display = ''; }
        else {
          var tags = (card.getAttribute('data-tags') || '').split(',');
          card.style.display = tags.indexOf(filter) !== -1 ? '' : 'none';
        }
      });
    });
  });
});

// === Tool Dimension Filter ===
document.querySelectorAll('#tool-filters .tool-filter-btn').forEach(function(btn){
  btn.addEventListener('click', function(){
    var dim = this.getAttribute('data-dim');
    document.querySelectorAll('#tool-filters .tool-filter-btn').forEach(function(b){ b.classList.remove('active'); });
    this.classList.add('active');
    document.querySelectorAll('.tool-card').forEach(function(card){
      if(dim === 'all'){ card.style.display = ''; }
      else {
        var cardDim = (card.getAttribute('data-dim') || '').split(',');
        card.style.display = cardDim.indexOf(dim) !== -1 ? '' : 'none';
      }
    });
  });
});

// Visit counter
(function(){
  var count = parseInt(localStorage.getItem('visitCount') || '0', 10);
  localStorage.setItem('visitCount', String(count + 1));
})();
</script>
</body>
