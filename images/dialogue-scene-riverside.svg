<svg viewBox="0 0 680 400" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>深索道、安德路、格林格·金 江边对话</title>
  <desc>黄昏时分，三人在江边旧码头深度对话</desc>

  <!-- Top sky: dusk indigo -->
  <rect x="0" y="0" width="680" height="140" fill="#1a1f3a"/>
  <!-- Mid sky: dusk purple -->
  <rect x="0" y="80" width="680" height="100" fill="#2a2440" opacity="0.8"/>

  <!-- Warm sunset glow on horizon -->
  <rect x="0" y="160" width="680" height="50" fill="#3a2a20" opacity="0.7"/>
  <rect x="300" y="150" width="380" height="60" fill="#4a3020" opacity="0.5"/>
  <ellipse cx="520" cy="180" rx="120" ry="30" fill="#5a3820" opacity="0.4"/>

  <!-- Distant city skyline -->
  <rect x="440" y="140" width="14" height="70" fill="#2a2a38"/>
  <rect x="462" y="130" width="12" height="80" fill="#2a2a38"/>
  <rect x="482" y="148" width="10" height="62" fill="#2a2a38"/>
  <rect x="500" y="122" width="16" height="88" fill="#2a2a38"/>
  <rect x="522" y="152" width="10" height="58" fill="#2a2a38"/>
  <rect x="550" y="136" width="12" height="74" fill="#2a2a38"/>
  <rect x="572" y="160" width="8" height="50" fill="#2a2a38"/>
  <rect x="600" y="125" width="14" height="85" fill="#2a2a38"/>

  <!-- Bright warm city lights -->
  <rect x="445" y="165" width="5" height="4" fill="#d4a853" opacity="0.8"/>
  <rect x="445" y="175" width="5" height="4" fill="#d4a853" opacity="0.6"/>
  <rect x="445" y="185" width="5" height="4" fill="#d4a853" opacity="0.4"/>
  <rect x="470" y="158" width="4" height="4" fill="#d4a853" opacity="0.7"/>
  <rect x="470" y="172" width="4" height="4" fill="#d4a853" opacity="0.4"/>
  <rect x="508" y="150" width="5" height="4" fill="#d4a853" opacity="0.9"/>
  <rect x="508" y="162" width="5" height="4" fill="#d4a853" opacity="0.6"/>
  <rect x="508" y="175" width="5" height="4" fill="#d4a853" opacity="0.4"/>
  <rect x="558" y="165" width="4" height="4" fill="#d4a853" opacity="0.5"/>
  <rect x="608" y="152" width="5" height="4" fill="#d4a853" opacity="0.8"/>
  <rect x="608" y="166" width="5" height="4" fill="#d4a853" opacity="0.5"/>
  <rect x="492" y="175" width="4" height="3" fill="#d4a853" opacity="0.5"/>
  <rect x="532" y="180" width="4" height="3" fill="#d4a853" opacity="0.3"/>

  <!-- Mist over water -->
  <ellipse cx="340" cy="230" rx="360" ry="25" fill="#2a2840" opacity="0.4"/>
  <ellipse cx="200" cy="235" rx="180" ry="18" fill="#282238" opacity="0.35"/>

  <!-- Water surface -->
  <rect x="0" y="230" width="680" height="170" fill="#151a30"/>

  <!-- Golden reflections on water -->
  <rect x="440" y="242" width="100" height="3" fill="#d4a853" opacity="0.3"/>
  <rect x="430" y="252" width="120" height="2" fill="#d4a853" opacity="0.25"/>
  <rect x="450" y="260" width="80" height="2" fill="#d4a853" opacity="0.2"/>
  <rect x="460" y="272" width="70" height="1.5" fill="#d4a853" opacity="0.2"/>
  <rect x="420" y="280" width="140" height="2" fill="#d4a853" opacity="0.15"/>
  <rect x="440" y="290" width="100" height="1.5" fill="#d4a853" opacity="0.15"/>
  <rect x="470" y="310" width="60" height="1.5" fill="#d4a853" opacity="0.12"/>
  <rect x="450" y="330" width="80" height="1" fill="#d4a853" opacity="0.1"/>
  <rect x="430" y="350" width="110" height="1.5" fill="#d4a853" opacity="0.08"/>
  <rect x="480" y="370" width="50" height="1" fill="#d4a853" opacity="0.06"/>

  <!-- Water ripples -->
  <line x1="440" y1="245" x2="550" y2="245" stroke="#8a7030" stroke-width="0.3" opacity="0.3"/>
  <line x1="420" y1="255" x2="560" y2="255" stroke="#8a7030" stroke-width="0.3" opacity="0.25"/>
  <line x1="450" y1="265" x2="530" y2="265" stroke="#8a7030" stroke-width="0.3" opacity="0.2"/>

  <!-- Dock / wooden pier -->
  <rect x="0" y="208" width="680" height="10" fill="#1a1820"/>
  <rect x="0" y="218" width="680" height="2" fill="#2a2a30"/>
  <rect x="260" y="192" width="8" height="26" fill="#1a1820"/>
  <rect x="370" y="192" width="8" height="26" fill="#1a1820"/>
  <rect x="255" y="190" width="128" height="5" fill="#222228"/>
  <rect x="260" y="198" width="118" height="3" fill="#1a1a22"/>

  <!-- Figure 1: 深索道 -->
  <g transform="translate(170, 150)">
    <rect x="-18" y="15" width="36" height="45" rx="6" fill="#2a2838"/>
    <rect x="-8" y="10" width="16" height="8" rx="3" fill="#3a3848"/>
    <circle cx="-2" cy="-4" r="13" fill="#3a3848"/>
    <ellipse cx="-2" cy="-10" rx="11" ry="5" fill="#2a2838"/>
    <path d="M-14 22 Q-28 35 -22 48" stroke="#2a2838" stroke-width="7" fill="none" stroke-linecap="round"/>
    <ellipse cx="-22" cy="50" rx="6" ry="5" fill="#3a3848"/>
  </g>

  <!-- Figure 2: 安德路 -->
  <g transform="translate(310, 145)">
    <rect x="-16" y="10" width="32" height="48" rx="5" fill="#2c2a3a"/>
    <rect x="-7" y="6" width="14" height="7" rx="3" fill="#3c3a4a"/>
    <circle cx="0" cy="-8" r="12" fill="#3c3a4a"/>
    <ellipse cx="0" cy="-14" rx="10" ry="4" fill="#2c2a3a"/>
    <path d="M-12 18 Q-22 28 -18 38" stroke="#2c2a3a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M12 16 Q24 20 20 30" stroke="#2c2a3a" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Figure 3: 格林格·金 -->
  <g transform="translate(440, 148)">
    <rect x="-14" y="12" width="28" height="46" rx="5" fill="#2e2c3c"/>
    <rect x="-6" y="3" width="12" height="12" rx="3" fill="#3e3c4c"/>
    <circle cx="0" cy="-8" r="12" fill="#3e3c4c"/>
    <ellipse cx="0" cy="-14" rx="10" ry="5" fill="#2e2c3c"/>
    <circle cx="5" cy="22" r="3" fill="#d4a853" opacity="0.9"/>
    <path d="M-10 18 Q-16 26 -14 36" stroke="#2e2c3c" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M10 18 Q16 26 14 36" stroke="#2e2c3c" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Golden rim light -->
  <path d="M152 155 Q162 152 170 160" stroke="#d4a853" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M154 170 Q160 168 168 175" stroke="#d4a853" stroke-width="1" fill="none" opacity="0.2"/>
  <path d="M294 150 Q302 148 312 155" stroke="#d4a853" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M296 165 Q304 163 310 170" stroke="#d4a853" stroke-width="1" fill="none" opacity="0.2"/>
  <path d="M426 152 Q434 148 442 155" stroke="#d4a853" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M428 168 Q434 165 442 172" stroke="#d4a853" stroke-width="1.5" fill="none" opacity="0.3"/>

  <!-- Gold line -->
  <line x1="230" y1="388" x2="450" y2="388" stroke="#d4a853" stroke-width="0.5" opacity="0.4"/>
</svg>
